# #
#   @type               github workflow
#   @desc               builds csf and publishes a GitHub release using only the built-in GITHUB_TOKEN
#   @notes              the upstream release.yml needs the upstream maintainer's private secrets
#                       (GPG keys, ADMINSERV tokens, Discord webhooks) and cannot run in a fork.
#                       this workflow produces the same csf/ package layout without them.
#
#   @usage              Actions › 📦 Release › Make Release › Run workflow
#                       or push a tag:  git tag 15.11 && git push origin 15.11
#
#   @output             csf-firewall-v<version>.zip
#                       csf-firewall-v<version>.tgz
#                       csf-firewall_<version>_all.deb   (Debian / Ubuntu)
#                       csf.zip, csf.tgz, csf-firewall.deb (fixed names for "latest" links)
#                       SHA256SUMS
# #

name: '📦 Release › Make Release'
run-name: '📦 Release › Make Release ${{ inputs.VERSION || github.ref_name }}'

on:
    workflow_dispatch:
        inputs:
            VERSION:
                description:        '🏷️ Version / tag (empty = src/version.txt). Must not already exist as a tag'
                required:           false
                default:            ''
                type:               string
            PRERELEASE:
                description:        '🧪 Mark as pre-release'
                required:           true
                default:            false
                type:               boolean
            DRAFT:
                description:        '📝 Create as draft (publish manually later)'
                required:           true
                default:            false
                type:               boolean
    push:
        tags:
            - '[0-9]+.[0-9]+*'

permissions:
    contents: write

concurrency:
    group: release-${{ github.ref }}
    cancel-in-progress: false

env:
    PROJECT_NAME: csf-firewall

jobs:
    release:
        name: '📦 Build & Publish'
        runs-on: ubuntu-latest

        steps:

            # #
            #   Checkout (full history so release notes can be generated)
            # #

            - name: '✅ Checkout'
              uses: actions/checkout@v4.4.0
              with:
                  fetch-depth: 0

            # #
            #   Version
            #
            #   tag push      → version is the tag that was pushed
            #   manual run    → VERSION input, or src/version.txt when empty
            # #

            - name: '🏷️ Resolve Version'
              id: version
              env:
                  INPUT_VERSION: ${{ inputs.VERSION }}
              run: |
                  if [ "${GITHUB_EVENT_NAME}" = "push" ]; then
                      VERSION="${GITHUB_REF_NAME}"
                      TAG_EXISTS_OK=true
                  else
                      VERSION="$(printf '%s' "${INPUT_VERSION}" | xargs)"
                      [ -z "${VERSION}" ] && VERSION="$(head -n1 src/version.txt | xargs)"
                      TAG_EXISTS_OK=false
                  fi

                  VERSION="${VERSION#v}"

                  if ! printf '%s' "${VERSION}" | grep -Eq '^[0-9]+\.[0-9]+(\.[0-9]+)?(-[0-9A-Za-z.]+)?$'; then
                      echo "::error::Invalid version '${VERSION}'. Use e.g. 15.11, 15.11.1 or 15.11-rc.1"
                      exit 1
                  fi

                  if [ "${TAG_EXISTS_OK}" = "false" ] && git rev-parse -q --verify "refs/tags/${VERSION}" >/dev/null; then
                      echo "::error::Tag ${VERSION} already exists. Enter a new VERSION (e.g. bump src/version.txt or type 15.11)."
                      exit 1
                  fi

                  echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
                  echo "package=${PROJECT_NAME}-v${VERSION}" >> "$GITHUB_OUTPUT"
                  echo "Releasing ${VERSION}"

            # #
            #   Checks - stop broken code from being released
            # #

            - name: '🧪 Install Check Dependencies'
              run: |
                  sudo apt-get -qq update
                  sudo apt-get -qq install -y libwww-perl liblwp-protocol-https-perl libnet-ip-perl iptables ipset gcc zip dpkg-dev lintian apt-utils >/dev/null

            - name: '🧪 Check › Perl Syntax'
              run: |
                  # lfd/csf load /etc/csf/csf.conf at compile time; give them a throwaway copy
                  sudo mkdir -p /etc/csf /usr/local/csf/lib
                  sudo cp src/csf.conf /etc/csf/csf.conf
                  sudo cp src/sanity.txt /usr/local/csf/lib/sanity.txt

                  cd src
                  fail=0
                  for f in ConfigServer/*.pm csf.pl lfd.pl auto*.pl; do
                      if ! out=$(perl -I. -c "$f" 2>&1); then
                          echo "::error file=src/$f::$out"
                          fail=1
                      fi
                  done
                  exit $fail

            - name: '🧪 Check › Shell Syntax'
              run: |
                  fail=0
                  for f in src/*.sh extras/scripts/*.sh get.sh; do
                      [ -f "$f" ] || continue
                      bash -n "$f" || { echo "::error file=$f::bash syntax error"; fail=1; }
                  done
                  exit $fail

            - name: '🧪 Check › Compile csf.c (DirectAdmin wrapper)'
              run: gcc -Wall -Werror -o /tmp/csf-wrapper src/csf.c

            # #
            #   Build - same layout as the upstream release: an archive containing csf/
            # #

            - name: '🔨 Build Package'
              env:
                  VERSION: ${{ steps.version.outputs.version }}
                  PACKAGE: ${{ steps.version.outputs.package }}
              run: |
                  rm -rf build && mkdir -p build/csf
                  cp README.md LICENSE.md build/csf/
                  cp -r src/* build/csf/

                  # Packaged version.txt matches the release version
                  printf '%s\n' "${VERSION}" > build/csf/version.txt

                  cd build
                  zip -qr "../${PACKAGE}.zip" csf
                  tar -czf "../${PACKAGE}.tgz" csf
                  cd ..

                  # Fixed names so README links (releases/latest/download/csf.zip) always work
                  cp "${PACKAGE}.zip" csf.zip
                  cp "${PACKAGE}.tgz" csf.tgz

            # #
            #   Debian / Ubuntu package
            # #

            # #
            #   The package installs an APT source so "apt-get upgrade" gets new releases.
            #   With secrets.APT_SIGNING_KEY (ASCII-armored private GPG key, no passphrase)
            #   the repository is signed and the package ships the public key (Signed-By).
            #   Without it, clients trust the repository over HTTPS only (Trusted: yes).
            # #

            - name: '📦 Build .deb'
              id: deb
              env:
                  VERSION: ${{ steps.version.outputs.version }}
                  APT_SIGNING_KEY: ${{ secrets.APT_SIGNING_KEY }}
              run: |
                  if [ -n "${APT_SIGNING_KEY}" ]; then
                      export GNUPGHOME="$(mktemp -d)"
                      printf '%s\n' "${APT_SIGNING_KEY}" | gpg --batch --quiet --import
                      gpg --batch --export > "${RUNNER_TEMP}/csf-firewall.gpg"
                      rm -rf "${GNUPGHOME}"; unset GNUPGHOME
                      export APT_KEYRING="${RUNNER_TEMP}/csf-firewall.gpg"
                      echo "APT repository: signed"
                  else
                      echo "::notice::APT repository is unsigned (HTTPS only). Add secret APT_SIGNING_KEY to sign it."
                  fi

                  DEB=$(bash extras/scripts/build-deb.sh "${VERSION}" .)
                  cp "${DEB}" csf-firewall.deb
                  echo "file=${DEB#./}" >> "$GITHUB_OUTPUT"

                  dpkg-deb --info "${DEB}"
                  # Errors fail the release; warnings (bundled fonts, upstream changelog format) are informational
                  lintian --fail-on error "${DEB}"

            - name: '🧪 Test .deb install / upgrade / purge'
              env:
                  DEB: ${{ steps.deb.outputs.file }}
              run: |
                  export DEBIAN_FRONTEND=noninteractive
                  sudo -E apt-get install -y -qq "./${DEB}"
                  dpkg -s csf-firewall | grep -E '^(Status|Version)'
                  # csf installs root-only (0700), so check as root
                  sudo test -x /usr/sbin/csf
                  sudo test -f /etc/csf/csf.conf
                  sudo /usr/sbin/csf -v

                  # reinstall = upgrade path; the CSF installer must keep changed settings
                  sudo sed -i 's/^LF_SSHD = .*/LF_SSHD = "3"/' /etc/csf/csf.conf
                  sudo -E apt-get install -y -qq --reinstall "./${DEB}"
                  sudo grep -q '^LF_SSHD = "3"' /etc/csf/csf.conf

                  sudo -E apt-get purge -y -qq csf-firewall
                  sudo test ! -e /etc/csf
                  sudo test ! -e /usr/sbin/csf

            - name: '🔐 Checksums'
              env:
                  PACKAGE: ${{ steps.version.outputs.package }}
                  DEB: ${{ steps.deb.outputs.file }}
              run: |
                  sha256sum "${PACKAGE}.zip" "${PACKAGE}.tgz" csf.zip csf.tgz "${DEB}" csf-firewall.deb > SHA256SUMS
                  cat SHA256SUMS

            # #
            #   Publish
            # #

            - name: '🚀 Create GitHub Release'
              env:
                  GH_TOKEN: ${{ github.token }}
                  VERSION: ${{ steps.version.outputs.version }}
                  PACKAGE: ${{ steps.version.outputs.package }}
                  DEB: ${{ steps.deb.outputs.file }}
                  PRERELEASE: ${{ inputs.PRERELEASE }}
                  DRAFT: ${{ inputs.DRAFT }}
              run: |
                  args=( "${VERSION}" "${PACKAGE}.zip" "${PACKAGE}.tgz" csf.zip csf.tgz "${DEB}" csf-firewall.deb SHA256SUMS
                         --title "${PROJECT_NAME} v${VERSION}"
                         --generate-notes
                         --target "${GITHUB_SHA}" )

                  [ "${PRERELEASE}" = "true" ] && args+=( --prerelease )
                  [ "${DRAFT}" = "true" ] && args+=( --draft )
                  case "${VERSION}" in *-*) args+=( --prerelease ) ;; esac

                  gh release create "${args[@]}"

                  {
                      echo "## 📦 Released ${PROJECT_NAME} v${VERSION}"
                      echo
                      echo "- ${PACKAGE}.zip"
                      echo "- ${PACKAGE}.tgz"
                      echo "- ${DEB}"
                      echo "- SHA256SUMS"
                      echo
                      echo "https://github.com/${GITHUB_REPOSITORY}/releases/tag/${VERSION}"
                  } >> "$GITHUB_STEP_SUMMARY"

            # #
            #   Update source for installed servers
            #
            #   csf -u, lfd AUTO_UPDATES and the daily csget cron read
            #   https://raw.githubusercontent.com/<repo>/dist/csf/version.txt and .../dist/csf.tgz
            #   (see src/downloadservers). Publish them on a single-commit "dist" branch.
            #   Skipped for drafts and pre-releases so servers only get stable versions.
            # #

            - name: '🌐 Publish update source (dist branch)'
              if: inputs.DRAFT != true && inputs.PRERELEASE != true && !contains(steps.version.outputs.version, '-')
              env:
                  VERSION: ${{ steps.version.outputs.version }}
                  DEB: ${{ steps.deb.outputs.file }}
                  APT_SIGNING_KEY: ${{ secrets.APT_SIGNING_KEY }}
              run: |
                  rm -rf dist && mkdir -p dist/csf
                  cp csf.tgz csf.zip dist/

                  # APT repository for "apt-get upgrade" (see extras/scripts/build-apt-repo.sh)
                  bash extras/scripts/build-apt-repo.sh dist/apt "${DEB}"
                  printf '%s\n' "${VERSION}" > dist/csf/version.txt
                  for f in changelog.txt install.txt readme.txt; do
                      [ -f "src/$f" ] && cp "src/$f" "dist/csf/$f"
                  done
                  cp LICENSE.md dist/csf/license.txt

                  cd dist
                  git init -q -b dist
                  git config user.name  "github-actions[bot]"
                  git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
                  git add -A
                  git commit -q -m "dist: ${VERSION}"
                  git push -f "https://x-access-token:${{ github.token }}@github.com/${GITHUB_REPOSITORY}.git" dist:dist

                  echo "Update source now serves ${VERSION}: https://raw.githubusercontent.com/${GITHUB_REPOSITORY}/dist/csf/version.txt" >> "$GITHUB_STEP_SUMMARY"
                  echo "APT repository now serves ${VERSION}: https://raw.githubusercontent.com/${GITHUB_REPOSITORY}/dist/apt/" >> "$GITHUB_STEP_SUMMARY"
